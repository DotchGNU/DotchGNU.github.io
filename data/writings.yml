# Popular-science writing for BRIC (Biological Research Information Center).
#
# These pieces are in Korean and their titles stay in Korean — a translated
# title is not the title, and a reader who follows the link lands on Korean
# prose either way. `subtitle` carries the English so the rest of the page
# still reads as one language, and the template prints an "in Korean" tag so
# nobody clicks through expecting English.
#
# Grouped: the group heading renders as an <h3>, the same shape Publications
# uses for First-author / Co-authored.
#
# `parts` is for a series still being written. The entry links the series
# index, so a new installment needs three lines here and nothing else — the
# index URL never changes.

