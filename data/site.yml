# Identity, header links, and the intro paragraph.
# `me` is the one place the author's own name is written. build.py finds this
# string in every author list and wraps it in <span class="me">.
# If the preferred rendering ever changes, change it here only.

name:   Geun-Woo D. Kim
me:     "Kim GW. D."

# Written out in full above the profile links, not hidden behind a mailto link.
# Keep this to ONE address: the masthead puts the name and this block on the
# same line, and two addresses push the profile links onto a second row.
emails:
  - gwpia0409@gmail.com

# Shown under the e-mail line, in this order.
links:
  - label: Google Scholar Profile
    url:   "https://scholar.google.com/citations?user=lsfAf-oAAAAJ&hl=en"
  - label: ORCID
    url:   "https://orcid.org/0000-0003-0161-6707"
  - label: CV (PDF)
    url:   "cv.pdf"

# Printed small under the publication list. These explain the markers that
# appear inside the `authors` strings, so they live next to that convention.
author_notes:
  - "* co-first authors"
  - "# co-corresponding authors"

# One list item per paragraph. Leave the list empty and the whole block is
# skipped, so the page has no hole in it.
bio:
  - >-
    I'm a Ph.D. candidate in Sung Wook Chi's lab at Korea University. I started
    out in the lab filming mice because I can't trust my own eyes, and found a
    pattern I hadn't been looking for.
  - >-
    Since then I've worked on RNA modifications, from mammalian cells to
    bacteria, and I keep learning the same lesson: the part of biology we can't
    measure is absurdly larger than the part we can. Which is also why I'm not
    worried about AI taking my job.
  - >-
    My guess is that the bottleneck for AI in biology is data rather than
    architecture, and that the data still has to be made at a bench.

# Phrases in `bio` that become links. Same idea as `me` above: the prose stays
# free of markup and build.py does the wrapping, so a phrase can be reworded
# here without touching the template. First occurrence only.
bio_links:
  "Sung Wook Chi's lab": "http://clip.korea.ac.kr/"

# Footer
updated: "August 2026"
